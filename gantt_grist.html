<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gantt Grist</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0f1117;
    --surface: #181c27;
    --surface2: #1e2333;
    --border: #2a3048;
    --accent: #4f8fff;
    --accent2: #ff6b6b;
    --accent3: #38d9a9;
    --accent4: #ffd43b;
    --accent5: #da77f2;
    --text: #e8ecf4;
    --text-muted: #6b7a99;
    --text-dim: #3d4a6b;
    --success: #38d9a9;
    --danger: #ff6b6b;
    --radius: 8px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Header ── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-logo {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .header-title {
    font-size: 14px;
    color: var(--text-muted);
    flex: 1;
  }
  .status-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .status-pill.connected { background: rgba(56,217,169,0.12); color: var(--success); border: 1px solid rgba(56,217,169,0.25); }
  .status-pill.disconnected { background: rgba(255,107,107,0.12); color: var(--danger); border: 1px solid rgba(255,107,107,0.25); }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* ── Layout ── */
  .app { display: flex; flex-direction: column; height: calc(100vh - 52px); }

  /* ── Toolbar ── */
  .toolbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: var(--radius);
    font-size: 12px; font-weight: 600; cursor: pointer;
    border: 1px solid transparent; transition: all 0.15s ease;
    font-family: 'DM Sans', sans-serif;
    letter-spacing: 0.3px;
  }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { background: #3a6fd8; }
  .btn-ghost { background: transparent; color: var(--text-muted); border-color: var(--border); }
  .btn-ghost:hover { background: var(--surface2); color: var(--text); }
  .btn-danger { background: transparent; color: var(--danger); border-color: rgba(255,107,107,0.3); }
  .btn-danger:hover { background: rgba(255,107,107,0.1); }
  .btn svg { width: 14px; height: 14px; }

  .toolbar-sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }

  .zoom-group { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  .zoom-label { font-size: 11px; color: var(--text-muted); margin-right: 4px; }

  select.filter-select {
    background: var(--surface2); color: var(--text); border: 1px solid var(--border);
    padding: 6px 10px; border-radius: var(--radius); font-size: 12px;
    font-family: 'DM Sans', sans-serif; cursor: pointer;
  }

  /* ── Gantt Container ── */
  .gantt-wrapper {
    flex: 1;
    overflow: auto;
    position: relative;
    background: var(--bg);
  }

  .gantt-container {
    display: grid;
    grid-template-columns: 280px 1fr;
    min-width: 900px;
  }

  /* ── Task List (Left) ── */
  .task-list-header {
    background: var(--surface);
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .task-list-header-inner {
    padding: 0 16px;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .col-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
  }

  .task-rows {
    border-right: 1px solid var(--border);
  }
  .task-row {
    display: grid;
    grid-template-columns: 24px 1fr;
    align-items: center;
    height: 44px;
    padding: 0 16px;
    border-bottom: 1px solid var(--border);
    gap: 8px;
    cursor: pointer;
    transition: background 0.1s;
  }
  .task-row:hover { background: var(--surface2); }
  .task-row.selected { background: rgba(79,143,255,0.08); }

  .task-color-dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  }
  .task-name-cell {
    font-size: 13px; font-weight: 500; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; color: var(--text);
  }
  .task-name-cell small {
    display: block; font-size: 10px; color: var(--text-muted); font-weight: 400;
  }

  /* ── Timeline (Right) ── */
  .timeline-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
    overflow: hidden;
    height: 56px;
  }
  .timeline-months {
    display: flex;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
  }
  .month-block {
    border-right: 1px solid var(--border);
    flex-shrink: 0;
    position: relative;
  }
  .month-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
    padding: 8px 10px 0;
  }
  .day-labels {
    display: flex;
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
  }
  .day-label {
    font-size: 9px;
    color: var(--text-dim);
    text-align: center;
    flex: 1;
    padding-bottom: 4px;
  }
  .day-label.today-label { color: var(--accent); font-weight: 700; }

  .timeline-body {
    position: relative;
    overflow: hidden;
  }
  .timeline-grid-row {
    height: 44px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .timeline-grid-row:hover { background: rgba(255,255,255,0.02); }

  .day-col {
    position: absolute;
    top: 0; bottom: 0;
    border-right: 1px solid rgba(255,255,255,0.03);
  }
  .day-col.weekend { background: rgba(255,255,255,0.015); }
  .day-col.today-line {
    border-right: 1px solid rgba(79,143,255,0.4);
  }

  /* ── Gantt Bar ── */
  .gantt-bar {
    position: absolute;
    top: 8px; height: 28px;
    border-radius: 5px;
    cursor: grab;
    display: flex;
    align-items: center;
    padding: 0 8px;
    font-size: 11px;
    font-weight: 600;
    color: #fff;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    transition: filter 0.15s, transform 0.1s;
    user-select: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .gantt-bar:hover { filter: brightness(1.15); transform: translateY(-1px); }
  .gantt-bar .bar-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gantt-bar .resize-handle {
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 8px;
    cursor: ew-resize;
    background: rgba(255,255,255,0.2);
    border-radius: 0 5px 5px 0;
  }

  /* ── Progress bar inside bar ── */
  .bar-progress {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    background: rgba(0,0,0,0.2);
    border-radius: 5px;
    pointer-events: none;
  }

  /* ── Today line ── */
  .today-vline {
    position: absolute;
    top: 0; bottom: 0;
    width: 2px;
    background: rgba(79,143,255,0.5);
    pointer-events: none;
    z-index: 5;
  }
  .today-vline::after {
    content: 'Aujourd\'hui';
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    color: var(--accent);
    white-space: nowrap;
    font-weight: 700;
  }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    z-index: 200;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    width: 480px;
    max-width: 95vw;
    box-shadow: var(--shadow);
    transform: translateY(10px);
    transition: transform 0.2s;
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-title {
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 20px;
    letter-spacing: 1px;
  }
  .form-group { margin-bottom: 16px; }
  .form-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.8px; color: var(--text-muted); margin-bottom: 6px; display: block;
  }
  .form-control {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 12px;
    border-radius: var(--radius);
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    transition: border-color 0.15s;
  }
  .form-control:focus { outline: none; border-color: var(--accent); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-actions { display: flex; gap: 8px; margin-top: 24px; justify-content: flex-end; }

  .color-swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .color-swatch {
    width: 28px; height: 28px; border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer; transition: transform 0.15s;
  }
  .color-swatch:hover { transform: scale(1.15); }
  .color-swatch.active { border-color: #fff; }

  /* ── Legend / Stats ── */
  .stats-bar {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 8px 20px;
    display: flex;
    gap: 24px;
    align-items: center;
    font-size: 11px;
  }
  .stat-item { color: var(--text-muted); }
  .stat-value { color: var(--text); font-weight: 600; }

  /* ── Empty state ── */
  .empty-state {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 60px 20px;
    gap: 12px;
    color: var(--text-muted);
    grid-column: 1 / -1;
  }
  .empty-icon { font-size: 48px; opacity: 0.3; }
  .empty-text { font-size: 14px; }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 24px; right: 24px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 18px;
    border-radius: var(--radius);
    font-size: 13px;
    box-shadow: var(--shadow);
    z-index: 999;
    transform: translateY(10px);
    opacity: 0;
    transition: all 0.25s;
    max-width: 300px;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { border-color: rgba(56,217,169,0.4); }
  .toast.error { border-color: rgba(255,107,107,0.4); }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── Tooltip ── */
  .gantt-tooltip {
    position: fixed;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    pointer-events: none;
    z-index: 300;
    box-shadow: var(--shadow);
    display: none;
    max-width: 220px;
  }
  .tooltip-title { font-weight: 700; margin-bottom: 4px; color: var(--text); }
  .tooltip-row { color: var(--text-muted); margin: 2px 0; }
  .tooltip-row span { color: var(--text); }

  .progress-input { display: flex; align-items: center; gap: 10px; }
  .progress-input input[type=range] { flex: 1; accent-color: var(--accent); }
  .progress-val { font-size: 12px; color: var(--text-muted); min-width: 36px; }

  /* Loading */
  .loading-bar {
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent3));
    animation: loading 1.2s infinite;
    display: none;
  }
  @keyframes loading { 0%{transform:scaleX(0);transform-origin:left} 50%{transform:scaleX(1);transform-origin:left} 51%{transform-origin:right} 100%{transform:scaleX(0);transform-origin:right} }
  .loading-bar.active { display: block; }

  .grist-info {
    background: rgba(79,143,255,0.07);
    border: 1px solid rgba(79,143,255,0.2);
    border-radius: var(--radius);
    padding: 10px 14px;
    font-size: 12px;
    color: var(--text-muted);
    margin: 0 20px 0 0;
    flex: 1;
  }
  .grist-info strong { color: var(--accent); }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-logo">◈ Gantt</div>
  <div class="header-title">Diagramme de Gantt — Grist</div>
  <div class="grist-info" id="gristTableInfo">
    <strong>Grist :</strong> En attente de connexion…
  </div>
  <div class="status-pill disconnected" id="connectionStatus">
    <div class="status-dot"></div>
    <span id="statusText">Non connecté</span>
  </div>
</div>
<div class="loading-bar" id="loadingBar"></div>

<!-- Toolbar -->
<div class="toolbar">
  <button class="btn btn-primary" onclick="openModal()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Ajouter une tâche
  </button>
  <div class="toolbar-sep"></div>
  <select class="filter-select" id="filterStatus" onchange="applyFilter()">
    <option value="">Tous les statuts</option>
    <option value="En cours">En cours</option>
    <option value="Terminé">Terminé</option>
    <option value="En attente">En attente</option>
    <option value="Bloqué">Bloqué</option>
  </select>
  <select class="filter-select" id="filterResponsible" onchange="applyFilter()">
    <option value="">Tous les responsables</option>
  </select>
  <div class="toolbar-sep"></div>
  <div class="zoom-group">
    <span class="zoom-label">Zoom :</span>
    <button class="btn btn-ghost" onclick="setZoom(0.5)">×½</button>
    <button class="btn btn-ghost" onclick="setZoom(1)">×1</button>
    <button class="btn btn-ghost" onclick="setZoom(2)">×2</button>
  </div>
  <button class="btn btn-ghost" onclick="scrollToToday()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="12" x2="15" y2="14"/></svg>
    Aujourd'hui
  </button>
</div>

<!-- App -->
<div class="app">
  <div class="gantt-wrapper" id="ganttWrapper">
    <div class="gantt-container" id="ganttContainer">
      <!-- Header row -->
      <div class="task-list-header">
        <div class="task-list-header-inner">
          <span class="col-label">Tâches</span>
        </div>
      </div>
      <div class="timeline-header" id="timelineHeader">
        <div class="timeline-months" id="timelineMonths"></div>
      </div>

      <!-- Body -->
      <div class="task-rows" id="taskRows"></div>
      <div class="timeline-body" id="timelineBody"></div>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat-item">Tâches : <span class="stat-value" id="statTotal">0</span></div>
    <div class="stat-item">En cours : <span class="stat-value" id="statInProgress">0</span></div>
    <div class="stat-item">Terminées : <span class="stat-value" id="statDone">0</span></div>
    <div class="stat-item">Durée totale : <span class="stat-value" id="statDays">0</span> jours</div>
    <div style="margin-left:auto;font-size:11px;color:var(--text-dim)">Clic sur une tâche pour éditer • Glisser pour déplacer</div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOnBackdrop(event)">
  <div class="modal">
    <div class="modal-title" id="modalTitle">▸ NOUVELLE TÂCHE</div>
    <div class="form-group">
      <label class="form-label">Nom de la tâche *</label>
      <input class="form-control" id="fName" placeholder="Ex: Design maquettes" />
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Date de début *</label>
        <input class="form-control" type="date" id="fStart" />
      </div>
      <div class="form-group">
        <label class="form-label">Date de fin *</label>
        <input class="form-control" type="date" id="fEnd" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Responsable</label>
        <input class="form-control" id="fResponsible" placeholder="Ex: Marie D." />
      </div>
      <div class="form-group">
        <label class="form-label">Statut</label>
        <select class="form-control" id="fStatus">
          <option>En cours</option>
          <option>Terminé</option>
          <option>En attente</option>
          <option>Bloqué</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Avancement (%)</label>
      <div class="progress-input">
        <input type="range" min="0" max="100" step="5" id="fProgress" value="0" oninput="document.getElementById('fProgressVal').textContent=this.value+'%'">
        <span class="progress-val" id="fProgressVal">0%</span>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Couleur</label>
      <div class="color-swatches" id="colorSwatches"></div>
    </div>
    <div class="form-group">
      <label class="form-label">Description / Notes</label>
      <textarea class="form-control" id="fNote" rows="2" placeholder="Optionnel…"></textarea>
    </div>
    <div class="form-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
      <button class="btn btn-danger" id="btnDelete" onclick="deleteTask()" style="display:none">Supprimer</button>
      <button class="btn btn-primary" onclick="saveTask()">Enregistrer</button>
    </div>
  </div>
</div>

<!-- Tooltip -->
<div class="gantt-tooltip" id="ganttTooltip"></div>
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════
//  CONFIGURATION
// ═══════════════════════════════════════════════════════
const COLORS = ['#4f8fff','#ff6b6b','#38d9a9','#ffd43b','#da77f2','#ff922b','#74c0fc','#63e6be','#f783ac','#a9e34b'];
const STATUS_COLORS = { 'En cours':'#4f8fff', 'Terminé':'#38d9a9', 'En attente':'#ffd43b', 'Bloqué':'#ff6b6b' };
const COL_MAP = {
  name: 'Nom',
  start: 'Debut',
  end: 'Fin',
  responsible: 'Responsable',
  status: 'Statut',
  progress: 'Avancement',
  color: 'Couleur',
  note: 'Note'
};

// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
let tasks = [];
let filteredTasks = [];
let editingId = null;
let selectedColor = COLORS[0];
let zoom = 1; // px per day
const DAY_PX_BASE = 28;
let dayPx = DAY_PX_BASE;
let ganttStart = null;
let ganttEnd = null;
let totalDays = 0;
let gristReady = false;
let gristTableName = '';
let pendingGristWrite = false;
let syncInterval = null;
let lastRowCount = 0;

// ═══════════════════════════════════════════════════════
//  GRIST INTEGRATION
// ═══════════════════════════════════════════════════════

// Grist envoie les dates en secondes depuis epoch (timestamp Unix)
// On convertit vers YYYY-MM-DD et inversement
function parseGristDate(val) {
  if (!val) return null;
  if (typeof val === 'number') {
    // Timestamp Unix en secondes → Date locale
    const d = new Date(val * 1000);
    // Correction décalage UTC pour éviter J-1
    const local = new Date(d.getTime() + d.getTimezoneOffset() * 60000);
    return local.toISOString().slice(0, 10);
  }
  if (typeof val === 'string' && val.length >= 10) return val.slice(0, 10);
  return null;
}

function dateToGristTimestamp(dateStr) {
  if (!dateStr) return null;
  // YYYY-MM-DD → timestamp Unix en secondes (midi UTC pour éviter décalages)
  const [y, m, d] = dateStr.split('-').map(Number);
  return Date.UTC(y, m - 1, d) / 1000;
}

function rowsToTasks(records) {
  // records est un tableau d'objets {id, Nom, Debut, Fin, ...}
  const newTasks = [];
  for (const rec of records) {
    const start = parseGristDate(rec[COL_MAP.start]);
    const end   = parseGristDate(rec[COL_MAP.end]);
    if (!start || !end) continue; // on ignore les lignes sans dates
    newTasks.push({
      id:          'g' + rec.id,
      gristId:     rec.id,
      name:        rec[COL_MAP.name]        || '(sans nom)',
      start,
      end,
      responsible: rec[COL_MAP.responsible] || '',
      status:      rec[COL_MAP.status]      || 'En cours',
      progress:    parseInt(rec[COL_MAP.progress]) || 0,
      color:       rec[COL_MAP.color]       || COLORS[rec.id % COLORS.length],
      note:        rec[COL_MAP.note]        || ''
    });
  }
  return newTasks;
}

function initGrist() {
  if (typeof grist === 'undefined') {
    setStatus(false, 'Mode démo (hors Grist)');
    loadDemoData();
    return;
  }

  // 1) Déclarer qu'on a besoin d'un accès complet
  grist.ready({ requiredAccess: 'full' });

  // 2) onRecords : callback officiel Grist, déclenché automatiquement
  //    à chaque modification de la table liée → synchronisation table → vue
  grist.onRecords(function(records, mappings) {
    if (!records || records.length === 0) {
      tasks = [];
    } else {
      tasks = rowsToTasks(records);
    }
    setStatus(true, 'Connecté — ' + tasks.length + ' tâche(s)');
    applyFilter();
    showLoading(false);
  });

  // 3) Récupérer le nom de la table via l'API standard
  grist.getTable().then(function(tableId) {
    gristTableName = tableId;
    updateTableInfo();
  }).catch(function(e) {
    console.warn('getTable error:', e);
    // Fallback : on essaie de le lire depuis docApi
    grist.docApi.listTables().then(function(tables) {
      if (tables && tables.length > 0) {
        gristTableName = tables[0];
        updateTableInfo();
      }
    }).catch(function() {});
  });
}

function updateTableInfo() {
  document.getElementById('gristTableInfo').innerHTML =
    `<strong>Table :</strong> ${gristTableName} — Colonnes : <em>Nom, Debut, Fin, Responsable, Statut, Avancement, Couleur, Note</em>`;
}

async function writeToGrist(task) {
  if (typeof grist === 'undefined' || !gristTableName) {
    showToast('⚠ Grist non connecté', 'error');
    return;
  }
  try {
    showLoading(true);
    const record = {
      [COL_MAP.name]:        task.name,
      [COL_MAP.start]:       dateToGristTimestamp(task.start),
      [COL_MAP.end]:         dateToGristTimestamp(task.end),
      [COL_MAP.responsible]: task.responsible,
      [COL_MAP.status]:      task.status,
      [COL_MAP.progress]:    task.progress,
      [COL_MAP.color]:       task.color,
      [COL_MAP.note]:        task.note
    };
    if (task.gristId) {
      await grist.docApi.applyUserActions([
        ['UpdateRecord', gristTableName, task.gristId, record]
      ]);
    } else {
      const result = await grist.docApi.applyUserActions([
        ['AddRecord', gristTableName, null, record]
      ]);
      // result.rowIds[0] = l'id Grist de la nouvelle ligne
      if (result && result.rowIds && result.rowIds[0]) {
        task.gristId = result.rowIds[0];
        task.id = 'g' + task.gristId;
      }
    }
    showToast('✓ Enregistré dans Grist', 'success');
  } catch(e) {
    showToast('⚠ Erreur écriture : ' + e.message, 'error');
    console.error('writeToGrist error:', e);
  } finally {
    showLoading(false);
  }
}

async function deleteFromGrist(task) {
  if (typeof grist === 'undefined' || !task.gristId || !gristTableName) return;
  try {
    await grist.docApi.applyUserActions([
      ['RemoveRecord', gristTableName, task.gristId]
    ]);
  } catch(e) { console.error('deleteFromGrist error:', e); }
}

function setStatus(ok, msg) {
  gristReady = ok;
  const pill = document.getElementById('connectionStatus');
  const txt  = document.getElementById('statusText');
  pill.className = 'status-pill ' + (ok ? 'connected' : 'disconnected');
  txt.textContent = msg;
}

// ═══════════════════════════════════════════════════════
//  DEMO DATA (hors Grist uniquement)
// ═══════════════════════════════════════════════════════
function loadDemoData() {
  const today = new Date();
  const d = (offset) => {

  tasks = [

    { id: 'd3', name: 'Développement API',  start: d(-5),  end: d(15),  responsible: 'Claire', status: 'En cours',   progress: 40,  color: '#da77f2', note: '' },
    { id: 'd4', name: 'Tests & QA',         start: d(10),  end: d(25),  responsible: 'David',  status: 'En attente', progress: 0,   color: '#ffd43b', note: '' },

  ];

}

// ═══════════════════════════════════════════════════════
//  FILTER & RENDER
// ═══════════════════════════════════════════════════════
function applyFilter() {
  const statusF = document.getElementById('filterStatus').value;
  const respF = document.getElementById('filterResponsible').value;
  filteredTasks = tasks.filter(t => {
    if (statusF && t.status !== statusF) return false;
    if (respF && t.responsible !== respF) return false;
    return true;
  });
  updateResponsibleFilter();
  computeDateRange();
  render();
  updateStats();
}

function updateResponsibleFilter() {
  const sel = document.getElementById('filterResponsible');
  const cur = sel.value;
  const all = [...new Set(tasks.map(t => t.responsible).filter(Boolean))];
  sel.innerHTML = '<option value="">Tous les responsables</option>' +
    all.map(r => `<option value="${r}" ${r===cur?'selected':''}>${r}</option>`).join('');
}

function computeDateRange() {
  if (!filteredTasks.length) {
    const today = new Date();
    ganttStart = new Date(today.getFullYear(), today.getMonth(), 1);
    ganttEnd = new Date(today.getFullYear(), today.getMonth() + 3, 0);
  } else {
    const starts = filteredTasks.map(t => new Date(t.start));
    const ends = filteredTasks.map(t => new Date(t.end));
    ganttStart = new Date(Math.min(...starts));
    ganttEnd = new Date(Math.max(...ends));
    ganttStart.setDate(ganttStart.getDate() - 7);
    ganttEnd.setDate(ganttEnd.getDate() + 14);
  }
  // Align to month start
  ganttStart = new Date(ganttStart.getFullYear(), ganttStart.getMonth(), 1);
  ganttEnd = new Date(ganttEnd.getFullYear(), ganttEnd.getMonth() + 1, 0);
  totalDays = Math.ceil((ganttEnd - ganttStart) / 86400000);
  dayPx = DAY_PX_BASE * zoom;
}

function dateToX(dateStr) {
  const d = new Date(dateStr);
  return Math.round((d - ganttStart) / 86400000) * dayPx;
}

function xToDate(x) {
  const days = Math.round(x / dayPx);
  const d = new Date(ganttStart);
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

// ═══════════════════════════════════════════════════════
//  MAIN RENDER
// ═══════════════════════════════════════════════════════
function render() {
  renderHeader();
  renderTaskRows();
  renderTimelineRows();
}

function renderHeader() {
  const container = document.getElementById('timelineMonths');
  container.innerHTML = '';
  const totalW = totalDays * dayPx;
  container.style.width = totalW + 'px';

  let cur = new Date(ganttStart);
  const today = new Date();
  const todayStr = today.toISOString().slice(0, 10);

  while (cur <= ganttEnd) {
    const monthStart = new Date(cur.getFullYear(), cur.getMonth(), 1);
    const monthEnd = new Date(cur.getFullYear(), cur.getMonth() + 1, 0);
    const days = Math.min(monthEnd.getDate(), Math.ceil((ganttEnd - monthStart) / 86400000) + 1);

    const block = document.createElement('div');
    block.className = 'month-block';
    block.style.width = (days * dayPx) + 'px';

    const mn = cur.toLocaleDateString('fr-FR', { month: 'short', year: '2-digit' });
    block.innerHTML = `<div class="month-label">${mn}</div><div class="day-labels"></div>`;

    const dayLabels = block.querySelector('.day-labels');
    for (let d = 1; d <= days; d++) {
      const dd = new Date(cur.getFullYear(), cur.getMonth(), d);
      if (dd > ganttEnd) break;
      const ds = dd.toISOString().slice(0, 10);
      const lbl = document.createElement('div');
      lbl.className = 'day-label' + (ds === todayStr ? ' today-label' : '');
      lbl.style.width = dayPx + 'px';
      if (dayPx >= 20) lbl.textContent = d;
      dayLabels.appendChild(lbl);
    }
    container.appendChild(block);
    cur.setMonth(cur.getMonth() + 1);
  }

  document.getElementById('timelineHeader').style.width = totalW + 'px';
}

function renderTaskRows() {
  const rows = document.getElementById('taskRows');
  rows.innerHTML = '';
  if (!filteredTasks.length) {
    rows.innerHTML = '<div style="padding:40px 20px;color:var(--text-muted);font-size:13px;text-align:center">Aucune tâche. Cliquez sur « Ajouter ».</div>';
    return;
  }
  filteredTasks.forEach(t => {
    const row = document.createElement('div');
    row.className = 'task-row';
    row.dataset.id = t.id;
    row.innerHTML = `
      <div class="task-color-dot" style="background:${t.color}"></div>
      <div class="task-name-cell">${escapeHtml(t.name)}<small>${escapeHtml(t.responsible||'')} ${t.status ? '· '+t.status : ''}</small></div>
    `;
    row.addEventListener('click', () => openModal(t.id));
    rows.appendChild(row);
  });
}

function renderTimelineRows() {
  const body = document.getElementById('timelineBody');
  body.innerHTML = '';
  const totalW = totalDays * dayPx;
  body.style.width = totalW + 'px';
  body.style.position = 'relative';

  if (!filteredTasks.length) return;

  // Today line
  const today = new Date();
  const todayX = dateToX(today.toISOString().slice(0, 10));
  const todayLine = document.createElement('div');
  todayLine.className = 'today-vline';
  todayLine.style.left = todayX + 'px';
  body.appendChild(todayLine);

  filteredTasks.forEach((t, i) => {
    const row = document.createElement('div');
    row.className = 'timeline-grid-row';
    row.style.width = totalW + 'px';

    // Day columns
    for (let d = 0; d < totalDays; d++) {
      const cur = new Date(ganttStart);
      cur.setDate(cur.getDate() + d);
      const dow = cur.getDay();
      const col = document.createElement('div');
      col.className = 'day-col' + (dow === 0 || dow === 6 ? ' weekend' : '');
      col.style.left = (d * dayPx) + 'px';
      col.style.width = dayPx + 'px';
      row.appendChild(col);
    }

    // Bar
    const startX = dateToX(t.start);
    const endX = dateToX(t.end) + dayPx;
    const barW = Math.max(endX - startX, dayPx);

    const bar = document.createElement('div');
    bar.className = 'gantt-bar';
    bar.dataset.id = t.id;
    bar.style.left = startX + 'px';
    bar.style.width = barW + 'px';
    bar.style.background = t.color;

    // Progress overlay
    if (t.progress > 0) {
      const prog = document.createElement('div');
      prog.className = 'bar-progress';
      prog.style.width = t.progress + '%';
      bar.appendChild(prog);
    }

    const lbl = document.createElement('span');
    lbl.className = 'bar-label';
    lbl.textContent = t.name;
    bar.appendChild(lbl);

    // Resize handle
    const handle = document.createElement('div');
    handle.className = 'resize-handle';
    bar.appendChild(handle);

    // Tooltip
    bar.addEventListener('mouseenter', (e) => showTooltip(e, t));
    bar.addEventListener('mousemove', (e) => moveTooltip(e));
    bar.addEventListener('mouseleave', hideTooltip);
    bar.addEventListener('click', (e) => {
      e.stopPropagation();
      openModal(t.id);
    });

    setupDrag(bar, t, row);
    setupResize(handle, bar, t);

    row.appendChild(bar);
    body.appendChild(row);
  });
}

// ═══════════════════════════════════════════════════════
//  DRAG (move bar)
// ═══════════════════════════════════════════════════════
function setupDrag(bar, task, row) {
  let dragging = false, startX, origLeft;
  bar.addEventListener('mousedown', (e) => {
    if (e.target.classList.contains('resize-handle')) return;
    dragging = true;
    startX = e.clientX;
    origLeft = parseInt(bar.style.left);
    document.body.style.cursor = 'grabbing';
    e.preventDefault();
  });
  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    const newLeft = Math.max(0, origLeft + dx);
    bar.style.left = newLeft + 'px';
  });
  document.addEventListener('mouseup', async (e) => {
    if (!dragging) return;
    dragging = false;
    document.body.style.cursor = '';
    const newLeft = parseInt(bar.style.left);
    const dx = newLeft - origLeft;
    if (Math.abs(dx) < 4) return;
    const startDate = new Date(task.start);
    const endDate = new Date(task.end);
    const dayShift = Math.round(dx / dayPx);
    startDate.setDate(startDate.getDate() + dayShift);
    endDate.setDate(endDate.getDate() + dayShift);
    task.start = startDate.toISOString().slice(0, 10);
    task.end = endDate.toISOString().slice(0, 10);
    await writeToGrist(task);
    render();
  });
}

// ═══════════════════════════════════════════════════════
//  RESIZE (extend end date)
// ═══════════════════════════════════════════════════════
function setupResize(handle, bar, task) {
  let resizing = false, startX, origW;
  handle.addEventListener('mousedown', (e) => {
    resizing = true;
    startX = e.clientX;
    origW = parseInt(bar.style.width);
    document.body.style.cursor = 'ew-resize';
    e.preventDefault();
    e.stopPropagation();
  });
  document.addEventListener('mousemove', (e) => {
    if (!resizing) return;
    const dx = e.clientX - startX;
    const newW = Math.max(dayPx, origW + dx);
    bar.style.width = newW + 'px';
  });
  document.addEventListener('mouseup', async (e) => {
    if (!resizing) return;
    resizing = false;
    document.body.style.cursor = '';
    const newW = parseInt(bar.style.width);
    const daysDiff = Math.round((newW - origW) / dayPx);
    if (daysDiff === 0) return;
    const endDate = new Date(task.end);
    endDate.setDate(endDate.getDate() + daysDiff);
    task.end = endDate.toISOString().slice(0, 10);
    await writeToGrist(task);
    render();
  });
}

// ═══════════════════════════════════════════════════════
//  TOOLTIP
// ═══════════════════════════════════════════════════════
function showTooltip(e, t) {
  const tip = document.getElementById('ganttTooltip');
  const dur = Math.round((new Date(t.end) - new Date(t.start)) / 86400000) + 1;
  tip.innerHTML = `
    <div class="tooltip-title" style="color:${t.color}">${escapeHtml(t.name)}</div>
    <div class="tooltip-row">📅 <span>${t.start}</span> → <span>${t.end}</span> (${dur}j)</div>
    <div class="tooltip-row">👤 <span>${escapeHtml(t.responsible||'-')}</span></div>
    <div class="tooltip-row">⚡ <span>${t.status}</span> · <span>${t.progress}%</span></div>
    ${t.note ? `<div class="tooltip-row">📝 <span>${escapeHtml(t.note)}</span></div>` : ''}
  `;
  tip.style.display = 'block';
  moveTooltip(e);
}
function moveTooltip(e) {
  const tip = document.getElementById('ganttTooltip');
  tip.style.left = (e.clientX + 14) + 'px';
  tip.style.top = (e.clientY - 10) + 'px';
}
function hideTooltip() {
  document.getElementById('ganttTooltip').style.display = 'none';
}

// ═══════════════════════════════════════════════════════
//  MODAL
// ═══════════════════════════════════════════════════════
function initColorSwatches() {
  const c = document.getElementById('colorSwatches');
  c.innerHTML = COLORS.map(col =>
    `<div class="color-swatch ${col===selectedColor?'active':''}" style="background:${col}" onclick="selectColor('${col}')"></div>`
  ).join('');
}

function selectColor(col) {
  selectedColor = col;
  initColorSwatches();
}

function openModal(id) {
  editingId = id || null;
  const modal = document.getElementById('modalOverlay');
  const title = document.getElementById('modalTitle');
  const btnDel = document.getElementById('btnDelete');

  if (id) {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    title.textContent = '▸ MODIFIER LA TÂCHE';
    document.getElementById('fName').value = t.name;
    document.getElementById('fStart').value = t.start;
    document.getElementById('fEnd').value = t.end;
    document.getElementById('fResponsible').value = t.responsible;
    document.getElementById('fStatus').value = t.status;
    document.getElementById('fProgress').value = t.progress;
    document.getElementById('fProgressVal').textContent = t.progress + '%';
    document.getElementById('fNote').value = t.note;
    selectedColor = t.color;
    btnDel.style.display = 'inline-flex';
  } else {
    title.textContent = '▸ NOUVELLE TÂCHE';
    document.getElementById('fName').value = '';
    const today = new Date().toISOString().slice(0, 10);
    const inWeek = new Date();
    inWeek.setDate(inWeek.getDate() + 7);
    document.getElementById('fStart').value = today;
    document.getElementById('fEnd').value = inWeek.toISOString().slice(0, 10);
    document.getElementById('fResponsible').value = '';
    document.getElementById('fStatus').value = 'En cours';
    document.getElementById('fProgress').value = 0;
    document.getElementById('fProgressVal').textContent = '0%';
    document.getElementById('fNote').value = '';
    selectedColor = COLORS[tasks.length % COLORS.length];
    btnDel.style.display = 'none';
  }
  initColorSwatches();
  modal.classList.add('open');
  document.getElementById('fName').focus();
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  editingId = null;
}

function closeModalOnBackdrop(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

async function saveTask() {
  const name = document.getElementById('fName').value.trim();
  const start = document.getElementById('fStart').value;
  const end = document.getElementById('fEnd').value;
  if (!name || !start || !end) { showToast('⚠ Nom, début et fin requis', 'error'); return; }
  if (new Date(start) > new Date(end)) { showToast('⚠ La fin doit être après le début', 'error'); return; }

  const data = {
    name,
    start,
    end,
    responsible: document.getElementById('fResponsible').value.trim(),
    status: document.getElementById('fStatus').value,
    progress: parseInt(document.getElementById('fProgress').value),
    color: selectedColor,
    note: document.getElementById('fNote').value.trim()
  };

  if (editingId) {
    const idx = tasks.findIndex(t => t.id === editingId);
    if (idx !== -1) {
      Object.assign(tasks[idx], data);
      await writeToGrist(tasks[idx]);
    }
  } else {
    const newTask = { id: 'local_' + Date.now(), ...data };
    tasks.push(newTask);
    await writeToGrist(newTask);
  }
  closeModal();
  applyFilter();
}

async function deleteTask() {
  if (!editingId) return;
  const idx = tasks.findIndex(t => t.id === editingId);
  if (idx !== -1) {
    await deleteFromGrist(tasks[idx]);
    tasks.splice(idx, 1);
  }
  closeModal();
  applyFilter();
}

// ═══════════════════════════════════════════════════════
//  ZOOM & SCROLL
// ═══════════════════════════════════════════════════════
function setZoom(z) {
  zoom = z;
  dayPx = DAY_PX_BASE * zoom;
  render();
}

function scrollToToday() {
  const wrapper = document.getElementById('ganttWrapper');
  const todayX = dateToX(new Date().toISOString().slice(0, 10));
  wrapper.scrollLeft = todayX - 200;
}

// ═══════════════════════════════════════════════════════
//  STATS
// ═══════════════════════════════════════════════════════
function updateStats() {
  document.getElementById('statTotal').textContent = filteredTasks.length;
  document.getElementById('statInProgress').textContent = filteredTasks.filter(t => t.status === 'En cours').length;
  document.getElementById('statDone').textContent = filteredTasks.filter(t => t.status === 'Terminé').length;
  const totalD = filteredTasks.reduce((acc, t) => {
    return acc + Math.round((new Date(t.end) - new Date(t.start)) / 86400000) + 1;
  }, 0);
  document.getElementById('statDays').textContent = totalD;
}

// ═══════════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════════
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || '');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

function showLoading(on) {
  document.getElementById('loadingBar').className = 'loading-bar' + (on ? ' active' : '');
}

function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Sync header + task list scroll
function setupScrollSync() {
  const wrapper = document.getElementById('ganttWrapper');
  wrapper.addEventListener('scroll', () => {
    document.getElementById('timelineHeader').style.transform = `translateX(${-wrapper.scrollLeft + 280}px)`;
    // Actually header is inside ganttContainer, just let overflow handle it
  });
}

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  initColorSwatches();
  initGrist();
  // Keyboard shortcut
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'n' && !e.target.matches('input,textarea,select')) openModal();
  });
});
