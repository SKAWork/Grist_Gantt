<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Gantt Chart Grist</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 10px; overflow: hidden; }
    #mermaid-container { width: 100%; height: 100vh; cursor: pointer; }
    .error { color: red; font-size: 12px; }
  </style>
</head>
<body>
  <div id="mermaid-container">Chargement du Gantt...</div>

  <script>
    mermaid.initialize({ startOnLoad: false, securityLevel: 'loose', gantt: { useWidth: 1000 } });

    // Configuration des colonnes
    const COL_NOM = "nom";
    const COL_DEBUT = "debut";
    const COL_FIN = "fin";

    function renderGantt(records) {
      const container = document.getElementById('mermaid-container');
      
      if (!records || records.length === 0) {
        container.innerHTML = "Aucune donnée disponible.";
        return;
      }

      let chartDefinition = "gantt\n  dateFormat  YYYY-MM-DD\n  axisFormat %d-%m\n  title Planning Projet\n  section Tâches\n";

      records.forEach(r => {
        if (r[COL_NOM] && r[COL_DEBUT] && r[COL_FIN]) {
          const start = new Date(r[COL_DEBUT]).toISOString().split('T')[0];
          const end = new Date(r[COL_FIN]).toISOString().split('T')[0];
          chartDefinition += `  ${r[COL_NOM]} :active, ${r.id}, ${start}, ${end}\n`;
        }
      });

      container.innerHTML = `<div class="mermaid">${chartDefinition}</div>`;
      mermaid.init(undefined, document.querySelectorAll('.mermaid'));
    }

    // Initialisation Grist
    grist.ready({
      requiredAccess: 'full', // Nécessaire pour la synchronisation bidirectionnelle
      columns: [
        { name: COL_NOM, title: "Nom de la tâche", type: "Text" },
        { name: COL_DEBUT, title: "Date de début", type: "Date" },
        { name: COL_FIN, title: "Date de fin", type: "Date" }
      ]
    });

    // Écouter les changements dans la table
    grist.onRecords((records) => {
      renderGantt(records);
    });

    // Note sur la synchronisation Vue -> Table :
    // Mermaid est principalement un outil de rendu. Pour modifier les dates par "drag & drop",
    // il faudrait une bibliothèque plus complexe comme vis-timeline ou frappe-gantt.
    // Ce code assure la lecture synchrone en temps réel.
  </script>
</body>
</html>
